name: Build CMF1 GKI Kernel (6.1.162 + Complete Nothing OSS Build Tree)

on:
  workflow_dispatch: # Allows manual trigger via the GitHub Actions UI

jobs:
  build-cmf1-full:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Storage Workspace
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Compiling Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Initialize Android Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://googleapis.com > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "PATH=$HOME/bin:$PATH" >> $GITHUB_ENV

      - name: Sync Google ACK Workspace (Android 15 - Kernel 6.1)
        run: |
          export PATH=$HOME/bin:$PATH
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          mkdir workspace && cd workspace
          # Pull official Android 15 Common Kernel base
          repo init -u https://googlesource.com -b android15-6.1
          repo sync -j$(nproc --all) --current-branch --no-tags --no-clone-bundle

      - name: Force Upgrade ACK to Upstream 6.1.162
        run: |
          cd workspace/common
          git fetch https://kernel.org linux-6.1.y
          git merge FETCH_HEAD --no-edit

      - name: Embed KernelSU Next Framework
        run: |
          cd workspace/common
          curl -LSs "https://githubusercontent.com" | bash -s main

      - name: Inject Nothing OSS Repositories (Master & Tetris Branches)
        run: |
          cd workspace
          
          # 1. Overlay Nothing's core kernel configurations over Google's common framework
          git clone --depth=1 -b mt6878/Tetris/16b https://github.com private/nothing-kernel-src
          cp -r private/nothing-kernel-src/* common/
          rm -rf private/nothing-kernel-src

          # 2. Clone the critical Build Configs repository into the /build folder (Uses master branch)
          git clone --depth=1 https://github.com build

          # 3. Add Vendor Device Modules (Display, Camera, Peripheral drivers)
          git clone --depth=1 -b mt6878/Tetris/16b https://github.com private/nothing-modules

          # 4. Add Core SoC Platform Modules (MediaTek hardware layer drivers)
          git clone --depth=1 -b mt6878/Tetris/16b https://github.com private/nothing-soc-modules

      - name: Execute Bazel Compilation
        run: |
          export PATH=$HOME/bin:$PATH
          cd workspace
          
          # Force bypass on strict KMI layout verification due to the .162 version change
          echo "KMI_SYMBOL_LIST_STRICT_MODE=false" >> common/build.config.gki.aarch64
          
          # Run the build using the newly mapped Bazel targets
          tools/bazel run --config=fast //common:kernel_aarch64_dist

      - name: Export Output Images and Modules
        uses: actions/upload-artifact@v4
        with:
          name: CMF-Phone1-Full-Kernel-6.1.162
          path: |
            workspace/out/android15-6.1/dist/Image
            workspace/out/android15-6.1/dist/*.ko
